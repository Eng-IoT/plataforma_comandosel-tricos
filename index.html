<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Microaulas | Comandos Elétricos Industriais</title><style>body{background:#070a0f;color:white;font:16px system-ui;display:grid;place-items:center;min-height:90vh}main{max-width:40rem;text-align:center;padding:2rem}</style></head><body><main><h1>Comandos Elétricos Industriais</h1><p id="status">Carregando laboratório interativo...</p></main><script>(async()=>{try{const files=Array.from({length:13},(_,i)=>"partes/v7-"+String(i+1).padStart(3,"0")+".txt");const buffers=await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw Error("Falha ao carregar "+f);return r.text()}));const html=buffers.join("");document.open();document.write(html);document.close()}catch(e){document.getElementById("status").textContent="Erro ao carregar a plataforma: "+e.message}})();</script></body></html>
